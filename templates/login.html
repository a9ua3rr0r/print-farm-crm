<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация — PrintFarm 3D</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #090d16 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.15rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 35px rgba(59, 130, 246, 0.15);
            padding: 2.5rem 2.2rem;
        }
        .form-label {
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }
        .input-group-text {
            background: #0f172a;
            border: 1px solid #334155;
            border-right: none;
            color: #94a3b8;
        }
        .form-control {
            background-color: #0f172a !important;
            border: 1px solid #334155;
            border-left: none;
            color: #ffffff !important;
            padding: 0.68rem 0.75rem;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #3b82f6;
        }
        .input-group:focus-within .input-group-text {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        .btn-submit {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 0.55rem;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }
        .demo-chip {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            color: #cbd5e1;
            font-size: 0.78rem;
            padding: 0.45rem 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
        }
        .demo-chip:hover {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="d-inline-flex p-3 rounded-4 bg-primary bg-opacity-10 text-primary mb-2 border border-primary border-opacity-25">
            <i class="bi bi-box-seam-fill fs-2"></i>
        </div>
        <h3 class="fw-bold mb-1 text-white">PrintFarm 3D</h3>
        <p style="color: #94a3b8; font-size: 0.86rem;">Информационная система учёта заказов и 3D-печати</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for cat, msg in messages %}
                <div class="alert alert-danger py-2 px-3 small border-0 mb-3" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5;">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ msg }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" id="loginForm">
        <div class="mb-3">
            <label class="form-label">Логин сотрудника</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" id="username" name="username" class="form-control" placeholder="Введите логин" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Пароль</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                <input type="password" id="password" name="password" class="form-control" placeholder="•••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-submit w-100">Войти в систему</button>
    </form>

    <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
        <div style="font-size: 0.76rem; color: #94a3b8; margin-bottom: 0.6rem;">Быстрый вход для демонстрации ролей:</div>
        <div class="d-flex justify-content-center gap-2">
            <button type="button" class="demo-chip" onclick="loginAs('admin')">
                <i class="bi bi-shield-check d-block mb-1 text-primary"></i>Админ
            </button>
            <button type="button" class="demo-chip" onclick="loginAs('manager')">
                <i class="bi bi-briefcase d-block mb-1 text-info"></i>Менеджер
            </button>
            <button type="button" class="demo-chip" onclick="loginAs('operator')">
                <i class="bi bi-cpu d-block mb-1 text-success"></i>Оператор
            </button>
        </div>
    </div>
</div>

<script>
    function loginAs(role) {
        document.getElementById('username').value = role;
        document.getElementById('password').value = '12345';
        document.getElementById('loginForm').submit();
    }
</script>

</body>
</html>
